name: ci

# The tests of Ceti on Ubuntu, where the runner image already has Firefox: the nightly Cesia, which follows Cesia's main
# and has the WebSocket client (1.1.0 doesn't; 1.2.0 will), then cesia check, and cesia test on both paths, each test
# starting a headless Firefox against the pages of tests/pages. A Firefox still running after them fails the job.
# A push that changes only the docs doesn't run the suite.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  # Each day too: Cesia's nightly follows Cesia's main, so a change there shows here without a push to Ceti.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CESIA_VERSION: nightly

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Cesia
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=cesia-linux-x86_64.tar.gz
          gh release download "$CESIA_VERSION" --repo www-celestial/cesia-lang --pattern "$archive*" --dir download
          (cd download && [ "$(sha256sum "$archive" | cut -d' ' -f1)" = "$(cut -d' ' -f1 < "$archive.sha256")" ])
          mkdir -p "$HOME/.cesia"
          tar -xzf "download/$archive" -C "$HOME/.cesia"
          echo "$HOME/.cesia/bin" >> "$GITHUB_PATH"
      - name: Versions
        run: |
          cesia version
          firefox --version
      - run: cesia check
      - run: cesia test
      - run: cesia test --no-spec
      - name: No Firefox left
        if: always()
        run: |
          if pgrep -a firefox; then
            echo "A Firefox outlived the tests."
            exit 1
          fi
