[project]
name = "ceti"
cesia = "1.1"

# The tests start Firefox, which listens on a port it chooses on 127.0.0.1, and serve their pages themselves.
[test]
allow = ["exec=firefox", "net=127.0.0.1"]
timeout = "30"

# cesia doc --site, through tools/site.sh: the site of Ceti, its book and the reference of its package.
[site]
title = "Ceti"
source = "https://github.com/www-celestial/ceti/blob/main/"
color = "#5f3dc4"
